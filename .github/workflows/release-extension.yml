name: Release Extension

# 不上架 Chrome Web Store（自用工具，可省去审核与开发者账号），
# 因此用 tag 触发打包，把 zip 挂到 GitHub Release，用户手动下载替换即可。
on:
  push:
    tags:
      - 'ext-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -r typecheck

      - name: 构建扩展
        run: pnpm build:ext

      - name: 校验 manifest 与必要文件
        run: |
          set -e
          test -f packages/extension/dist/manifest.json
          test -f packages/extension/dist/background.js
          test -f packages/extension/dist/popup.html
          test -f packages/extension/dist/options.html
          node -e "JSON.parse(require('fs').readFileSync('packages/extension/dist/manifest.json','utf8'))"
          echo "manifest 与入口文件齐备"

      - name: 打包 zip
        run: |
          cd packages/extension/dist
          zip -r "$GITHUB_WORKSPACE/extension.zip" .

      - name: 上传 Release 附件
        uses: softprops/action-gh-release@v2
        with:
          files: extension.zip
          body: |
            满天星 Chrome 扩展。

            安装方式：下载 `extension.zip` 解压 → 打开 `chrome://extensions` → 打开「开发者模式」→
            「加载已解压的扩展程序」→ 选择解压后的目录。

            更新方式：下载新版本解压后替换原目录，回到 `chrome://extensions` 点扩展卡片上的刷新按钮。
